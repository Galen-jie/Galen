server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 30m

spring:
  profiles:
    active: dev

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.galen.seckill.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.galen.seckill: debug
    org.springframework: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/galen-seckill.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# Actuator监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: galen-seckill

# 自定义配置
galen:
  seckill:
    # 秒杀路径过期时间（秒）
    path-expire: 60
    # 验证码过期时间（秒）
    captcha-expire: 300
    # 订单超时时间（分钟）
    order-timeout: 30
    # 最大重复购买次数
    max-buy-count: 1
  threadpool:
    core-size: 10
    max-pool-size: 50
    queue-capacity: 500
    keep-alive-time: 60
  # 文件上传配置
  upload:
    # 存储类型：local-本地存储，oss-阿里云OSS
    type: local
    # 本地存储路径
    local-path: D:/upload/pet-rescue
    # 访问URL前缀
    url-prefix: http://localhost:8080/upload/
    # 阿里云OSS配置
    oss:
      endpoint: oss-cn-beijing.aliyuncs.com
      access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
      bucket-name: galen-petrescue
      url-prefix: https://galen-petrescue.oss-cn-beijing.aliyuncs.com/
    # 允许的图片类型
    allowed-image-types: jpg,jpeg,png,gif
    # 允许的视频类型
    allowed-video-types: mp4,avi,mov
    # 单文件最大大小（字节）10MB
    max-size: 10485760
    # 批量上传最大数量
    max-batch-count: 10


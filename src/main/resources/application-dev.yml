spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/galen_seckill?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: admin123

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 200
          max-idle: 50
          min-idle: 20
          max-wait: -1

  # Session配置
  session:
    store-type: redis
    redis:
      namespace: galen:session
    timeout: 1800

  # RocketMQ配置
  rabbitmq:
    host: 192.168.100.130 # 你的虚拟机IP
    port: 5672 # 端口
    virtual-host: /galen # 虚拟主机
    username: galen # 用户名
    password: fglzsbjs520 # 密码
    listener:
      simple:
        pre-fetch: 1
        acknowledge-mode: auto

  # 缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 默认1小时
      cache-null-values: false

# Redisson配置
redisson:
  config: |
    singleServerConfig:
      address: redis://localhost:6379
      database: 0
      connectionPoolSize: 50
      connectionMinimumIdleSize: 10
      idleConnectionTimeout: 10000
      connectTimeout: 10000
      timeout: 3000
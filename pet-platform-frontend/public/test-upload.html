<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传测试</title>
</head>
<body>
    <h2>图片上传测试</h2>
    <input type="file" id="fileInput" accept="image/*">
    <button onclick="uploadFile()">上传图片</button>
    <div id="result"></div>
    <div id="imageList"></div>

    <script>
        let imageUrls = [];

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                alert('请选择文件');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('http://localhost:8080/file/upload', {
                    method: 'POST',
                    headers: {
                        'token': '你的token' // 需要替换为实际token
                    },
                    body: formData
                });

                const result = await response.json();
                console.log('上传响应:', result);

                if (result.code === 200) {
                    const url = result.data;
                    console.log('图片URL:', url);

                    imageUrls.push(url);
                    console.log('当前图片列表:', imageUrls);

                    document.getElementById('result').innerHTML = `
                        <p>上传成功！</p>
                        <p>URL: ${url}</p>
                    `;

                    // 显示图片
                    document.getElementById('imageList').innerHTML += `
                        <img src="${url}" style="max-width: 300px; margin: 10px;">
                    `;
                } else {
                    console.error('上传失败:', result);
                    alert('上传失败: ' + result.message);
                }
            } catch (error) {
                console.error('上传异常:', error);
                alert('上传异常: ' + error.message);
            }
        }

        function submitPet() {
            const data = {
                petType: 1,
                petName: '测试宠物',
                description: '这是一个测试',
                imageUrls: imageUrls
            };

            console.log('提交数据:', data);

            fetch('http://localhost:8080/pet', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'token': '你的token'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                console.log('提交响应:', result);
                if (result.code === 200) {
                    alert('发布成功！');
                } else {
                    alert('发布失败: ' + result.message);
                }
            })
            .catch(error => {
                console.error('提交异常:', error);
            });
        }
    </script>

    <hr>
    <h2>发布宠物</h2>
    <button onclick="submitPet()">提交（需要先上传图片）</button>
</body>
</html>
